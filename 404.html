<!DOCTYPE html>
<html lang="zh-tw">
<head>
  <meta charset="utf-8">
  <title>頁面已搬家</title>
  <script>
    // 部落格已搬到 /blog/,把舊網址(如 /posts/...)導向新位置
    var p = location.pathname;
    if (!p.startsWith('/blog/')) {
      location.replace('/blog' + p + location.search + location.hash);
    }
  </script>
</head>
<body>
  <p>這個頁面已搬到 <a href="/blog/">/blog/</a>,正在為你轉址…</p>
</body>
</html>
